name: "Unit tests"

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Python unit tests and promtool tests of the alert rules (podman is
      # preinstalled on the runner)
      - run: python3 -m unittest discover -s tests/unit -v
        env:
          CI: "true"
