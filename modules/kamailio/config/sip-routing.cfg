# SIP socket selection is independent of RTP/NAT detection and dialog variables.
# The destination URI takes precedence over the Request-URI, including transport.
route[SIP_DESTINATION] {
    # Preserve the EA-51 in-dialog sips interoperability rule.
    if ($avp(direction) == "in" && $dlg_var(direction) == "in" &&
            $du == $null && $ru =~ "^sips:" && !($ru =~ ";transport=")) {
        $ru = $(ru{s.replace,sips:,sip:}) + ";transport=udp";
        $du = $ru;
    }

    $var(sip_destination) = $ru;
    if ($du != $null && $du != "" && $du != 0) {
        $var(sip_destination) = $du;
    }
    $var(sip_destination_ip) = $(var(sip_destination){uri.host});
    $var(sip_transport) = $(var(sip_destination){uri.param,transport});
    if ($var(sip_destination) =~ "^sips:") {
        $var(sip_transport) = "tls";
    } else if ($var(sip_transport) == $null || $var(sip_transport) == "" || $var(sip_transport) == 0) {
        $var(sip_transport) = "udp";
    } else {
        $var(sip_transport) = $(var(sip_transport){s.tolower});
    }

    # A service subnet may also be included in LOCALNETWORKS.
    $var(sip_network) = "external";
    if ($var(sip_destination_ip) != $null && $var(sip_destination_ip) != "") {
        if ($var(sip_destination_ip) == "127.0.0.1") {
            $var(sip_network) = "loopback";
        } else if (is_in_subnet($var(sip_destination_ip), INTERNAL_NETWORK)) {
            $var(sip_network) = "internal";
        } else if (LOCALNETWORKS != "" && is_in_subnet($var(sip_destination_ip), LOCALNETWORKS)) {
            $var(sip_network) = "local";
        }
    }
}

route[SET_SOCKET] {
    if (!is_request()) return;
    route(SIP_DESTINATION);

    # Leave unsupported transports to their existing transport handler.
    if ($var(sip_transport) != "udp" && $var(sip_transport) != "tcp" && $var(sip_transport) != "tls") return;

    $var(sip_port) = "5060";
    if ($var(sip_transport) == "tls") $var(sip_port) = "5061";
    $var(sip_advertise_port) = $var(sip_port);
    $var(sip_bind_ip) = PUBLIC_IP;
    $var(sip_advertise_ip) = PUBLIC_IP;
#!ifdef WITH_LAN_SOCKETS
    $var(sip_bind_ip) = PRIVATE_IP;
    if ($var(sip_network) == "local") {
        $var(sip_advertise_ip) = PRIVATE_IP;
        $var(sip_port) = "6060";
        if ($var(sip_transport) == "tls") $var(sip_port) = "6061";
    }
#!endif
    if ($var(sip_network) == "internal") {
        $var(sip_bind_ip) = SERVICE_IP;
        $var(sip_advertise_ip) = SERVICE_IP;
    } else if ($var(sip_network) == "loopback") {
        $var(sip_bind_ip) = "127.0.0.1";
        $var(sip_advertise_ip) = "127.0.0.1";
    }
    $fs = $var(sip_transport) + ":" + $var(sip_bind_ip) + ":" + $var(sip_port);
}

route[SIP_RECORD_ROUTE] {
    # The receive socket can be 5060 even for a LAN peer when conntrack already
    # contains the reverse UDP flow. Preserve the real receive socket (including
    # TCP/TLS connection identifiers), but advertise the LAN address in its RR.
    # TOPOS then stores the correct Contact for each side of the initial dialog.
#!ifdef WITH_LAN_SOCKETS
    if (LOCALNETWORKS != "" && is_in_subnet($si, LOCALNETWORKS) && !is_in_subnet($si, INTERNAL_NETWORK) &&
            $si != "127.0.0.1" &&
            (proto == UDP || proto == TCP || proto == TLS) &&
            ($var(sip_transport) == "udp" || $var(sip_transport) == "tcp" || $var(sip_transport) == "tls")) {
        $var(sip_rr_source_port) = "5060";
        if (proto == TLS) $var(sip_rr_source_port) = "5061";
        $var(sip_rr_source) = PRIVATE_IP + ":" + $var(sip_rr_source_port) + ";transport=" + $(proto{s.tolower});
        $var(sip_rr_destination) = $var(sip_advertise_ip) + ":" + $var(sip_advertise_port) + ";transport=" + $var(sip_transport);
        $var(sip_rr_scheme) = "sip:";
        if ($ru =~ "^sips:") $var(sip_rr_scheme) = "sips:";
        # Match rr's enable_full_lr/append_fromtag settings, including NOTIFY
        # travelling against the initial dialog direction.
        $var(sip_rr_params) = ";lr=on";
        $var(sip_rr_fromtag) = $ft;
        if (has_totag() && is_direction("upstream")) $var(sip_rr_fromtag) = $tt;
        if ($var(sip_rr_fromtag) != $null && $var(sip_rr_fromtag) != "") {
            $var(sip_rr_params) = $var(sip_rr_params) + ";ftag=" + $var(sip_rr_fromtag);
        }
        if (!has_totag() && (isflagset(FLT_NATS) || isbflagset(FLB_NATB))) {
            $var(sip_rr_params) = $var(sip_rr_params) + ";nat=yes";
        }
        # Kamailio 5.8.8 record_route_preset() sets FL_RR_ADDED even inside a
        # branch, suppressing RR on subsequent parallel branches. Insert these
        # branch-local headers explicitly; keep destination before source and
        # r2=on on both so loose_route() and TOPOS consume them as one hop.
        if ($var(sip_rr_source) == $var(sip_rr_destination)) {
            insert_hf("Record-Route: <$var(sip_rr_scheme)$var(sip_rr_source)$var(sip_rr_params)>\r\n");
        } else {
            insert_hf("Record-Route: <$var(sip_rr_scheme)$var(sip_rr_destination);r2=on$var(sip_rr_params)>\r\nRecord-Route: <$var(sip_rr_scheme)$var(sip_rr_source);r2=on$var(sip_rr_params)>\r\n");
        }
        return;
    }
#!endif
    record_route();
    if (!has_totag() && (isflagset(FLT_NATS) || isbflagset(FLB_NATB))) {
        add_rr_param(";nat=yes");
    }
}
